[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-sage"
version = "0.1.0"
description = "Clone a GitHub user's public repos and build a local, chunk-aware knowledge base to answer questions about their code."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "anthropic>=1.6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
repo-sage = "reposage.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reposage"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
