# Dead man's switch for the nightly re-index.
#
# nightly-seed.yml only fires when the host is awake enough to report, so
# on its own it cannot distinguish "the seed worked" from "the machine was
# asleep, Docker was down, or cron never fired". This job watches for that
# silence: if no seed has reported within MAX_AGE_HOURS, it fails, and
# GitHub emails the owner exactly as it would for a failed seed.
#
# Note that GitHub disables scheduled workflows in a repository with no
# activity for 60 days. In a repo this quiet that is a real possibility -
# re-enable it from the Actions tab if the watchdog ever goes silent too.
name: Seed watchdog

on:
  schedule:
    # Nominally 06:00 UTC, four hours after the seed window. GitHub treats
    # this as a request, not an appointment: scheduled runs here have
    # started 7-11 hours late. The check below therefore measures against
    # the 06:00 deadline, never against the moment the job happens to run.
    # The off-the-hour minute avoids the top-of-hour rush that makes those
    # delays worst.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  actions: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Fail if no seed reported before the last deadline
        env:
          GH_TOKEN: ${{ github.token }}
          # The daily moment by which the 02:00 seed must have reported.
          # It is four hours after the seed window - the seed itself takes
          # minutes (see "Build natively" in the README), but a seed still
          # running at the deadline has not reported yet and would read as
          # a missed night.
          DEADLINE_UTC: "06:00"
          # How far before the deadline a report still counts. It has to
          # sit between two numbers: a healthy report is ~4h old at the
          # deadline, while the previous night's is ~28h old. Anything >= 28
          # would let a single missed seed pass; 12 clears both comfortably.
          MAX_AGE_HOURS: 12
        run: |
          latest=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/nightly-seed.yml/runs?per_page=1" \
            --jq '.workflow_runs[0].created_at // empty')

          if [ -z "$latest" ]; then
            echo "::error title=Nightly seed never reported::No run of nightly-seed.yml exists. Is scripts/nightly-seed.sh scheduled on the deployment host, and is SEED_ALERT_TOKEN set?"
            exit 1
          fi

          # The most recent deadline that has already passed. A run that
          # starts late (or is dispatched by hand) still judges that night,
          # so the delay can no longer age a healthy report into a failure.
          now=$(date -u +%s)
          deadline=$(date -u -d "today $DEADLINE_UTC" +%s)
          if [ "$now" -lt "$deadline" ]; then
            deadline=$(date -u -d "yesterday $DEADLINE_UTC" +%s)
          fi
          earliest_accepted=$(( deadline - MAX_AGE_HOURS * 3600 ))
          latest_epoch=$(date -u -d "$latest" +%s)

          deadline_iso=$(date -u -d "@$deadline" +%Y-%m-%dT%H:%M:%SZ)
          earliest_iso=$(date -u -d "@$earliest_accepted" +%Y-%m-%dT%H:%M:%SZ)
          echo "Last seed report: $latest. Deadline: $deadline_iso, accepting reports since $earliest_iso."

          if [ "$latest_epoch" -lt "$earliest_accepted" ]; then
            age_hours=$(( (deadline - latest_epoch) / 3600 ))
            echo "::error title=Nightly seed is silent::No seed had reported in the ${MAX_AGE_HOURS}h before the $deadline_iso deadline (last report ${age_hours}h before it). The deployment host may be asleep, offline, or unable to reach the GitHub API."
            exit 1
          fi
