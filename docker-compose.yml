services:
  reposage-web:
    # Pinned, and deliberately NOT defaulted from DOCKER_DEFAULT_PLATFORM:
    # this machine exports DOCKER_DEFAULT_PLATFORM=linux/x86_64 globally
    # (~/.dotfiles/mac/shell/.shell/env.sh), so inheriting it would build
    # the whole stack amd64-under-Rosetta on an arm64 Mac - where embedding
    # is slow enough that builds and seed runs look like they hang rather
    # than fail. That is the bug this pin exists to prevent.
    #
    # Because the two disagree, a bare `docker compose build` in that shell
    # now fails fast with "build.platforms does not support value set by
    # DOCKER_DEFAULT_PLATFORM" instead of silently doing the wrong thing.
    # Use `make up` / `make build`, which set them to agree. On an amd64
    # host, run `make PLATFORM=linux/amd64 up`.
    #
    # Measured on this host, native arm64: dependency layer builds from
    # scratch in ~66s; 89 real chunks embed in ~49s; a single query embeds
    # in 0.26s.
    platform: ${REPOSAGE_PLATFORM:-linux/arm64}
    restart: unless-stopped
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      GITHUB_USER: ${GITHUB_USER}
      LLM_PROVIDER: anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      # Recommended set for a public deployment - an open, uncapped
      # instance can have its budget exhausted by a stranger before the
      # friend/recruiter it's actually meant for gets to use it.
      WEB_ACCESS_CODE: ${WEB_ACCESS_CODE}
      WEB_HOURLY_REQUEST_LIMIT: ${WEB_HOURLY_REQUEST_LIMIT:-10}
      WEB_DAILY_REQUEST_LIMIT: ${WEB_DAILY_REQUEST_LIMIT:-30}
    volumes:
      # Repos and ChromaDB embeddings live in a named volume so they survive
      # rebuilds. Seed once with `docker compose run --rm reposage-web ...`
      # (see Dockerfile header). Re-run sync+embed when repos.txt changes.
      # The embedding model is NOT here - it's baked into the image, because
      # a named volume would be created root-owned and this runs as uid 1000.
      - reposage-data:/app/data
    # Hardening for a container that processes third-party content (the
    # sandbox clones visitor-submitted public repos): no Linux capabilities
    # beyond the default-safe set, no privilege escalation, and hard
    # resource caps so a pathological sandbox submission (e.g. something
    # that blows up during tree-sitter parsing) can't take down the host.
    # Not using `read_only: true` here - chromadb's SQLite backend
    # typically needs directory-level write access (WAL/lock files) even
    # for pure reads against the main store, so a read-only root risks
    # silently breaking the core Q&A feature; flagging that rather than
    # guessing it's safe.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    # Sized from measurement, not guesswork. Loading the fp32 embedding
    # model alone peaks at ~4.0GB RSS, and a worst-case encode (a full
    # batch of maximum-length chunks, which a hostile sandbox submission
    # can force) peaks at ~5.9GB. The previous 2g limit could not fit even
    # the model, and because Docker's default swap allowance is 2x the
    # memory limit, it thrashed instead of failing - a container pinned at
    # 100% CPU forever rather than a clean OOM. memswap_limit == mem_limit
    # disables that swap headroom so an overrun dies loudly and restarts.
    mem_limit: 8g
    memswap_limit: 8g

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/creds.json:/etc/cloudflared/creds.json:ro
    depends_on:
      # Wait for the model to finish loading, not just for the port to open -
      # otherwise the tunnel serves 524s for the first ~30s after every deploy.
      reposage-web:
        condition: service_healthy

volumes:
  reposage-data:
